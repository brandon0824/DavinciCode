<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Black Tile Gradient -->
    <linearGradient id="black-tile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- White Tile Gradient -->
    <linearGradient id="white-tile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="tile-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Ambient Glow inside background -->
  <circle cx="170" cy="180" r="140" fill="#6366f1" opacity="0.22" filter="blur(40px)" />
  <circle cx="340" cy="320" r="130" fill="#f59e0b" opacity="0.22" filter="blur(40px)" />

  <!-- LEFT TILE (Black Tile, #7) -->
  <g filter="url(#tile-shadow)" transform="rotate(-6 175 256)">
    <!-- Tile Body -->
    <rect x="105" y="110" width="140" height="260" rx="22" fill="url(#black-tile-grad)" stroke="#475569" stroke-width="4" />
    <!-- Tile Bevel Inner Highlight -->
    <rect x="110" y="115" width="130" height="250" rx="18" fill="none" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Number 7 (Gold) -->
    <text x="175" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="url(#gold-grad)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow-gold)">7</text>
    <!-- Base orientation line -->
    <rect x="140" y="315" width="70" height="8" rx="4" fill="url(#gold-grad)" />
  </g>

  <!-- RIGHT TILE (White Tile, #3) -->
  <g filter="url(#tile-shadow)" transform="rotate(6 335 256)">
    <!-- Tile Body -->
    <rect x="265" y="130" width="140" height="260" rx="22" fill="url(#white-tile-grad)" stroke="#ffffff" stroke-width="4" />
    <!-- Tile Inner Bevel -->
    <rect x="270" y="135" width="130" height="250" rx="18" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.3" />
    <!-- Number 3 (Deep slate/indigo) -->
    <text x="335" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">3</text>
    <!-- Base orientation line -->
    <rect x="300" y="335" width="70" height="8" rx="4" fill="#1e293b" />
  </g>

  <!-- Sparkle Accent in top right -->
  <path d="M 400 80 Q 400 110 430 110 Q 400 110 400 140 Q 400 110 370 110 Q 400 110 400 80 Z" fill="url(#gold-grad)" />
  <circle cx="400" cy="110" r="4" fill="#ffffff" />
  <path d="M 100 390 Q 100 405 115 405 Q 100 405 100 420 Q 100 405 85 405 Q 100 405 100 390 Z" fill="#818cf8" opacity="0.8" />
</svg>
