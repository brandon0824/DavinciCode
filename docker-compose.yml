services:
  postgres:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: brandon_pgdb
      POSTGRES_DB: davinci
    volumes:
      - ${PG_DATA_DIR:?PG_DATA_DIR must be set in .env.docker}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d davinci"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: davinci-code:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: brandon_pgdb
      DB_NAME: davinci
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env.docker}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:60824:60824"
    restart: unless-stopped
